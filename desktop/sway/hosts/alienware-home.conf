# Alienware m15 R7-specific sway config — home location.
# Symlinked to ~/.config/sway/config.d/local.conf by `make setup-alienware-home`.
# Loaded early (before $menu/outputs are used) — see include order in ../config.

# Keyboard layout. Under X11 (i3/GDM) this comes for free from /etc/default/keyboard
# via generated Xorg config, but sway is a native Wayland compositor and never reads
# Xorg config — libxkbcommon falls back to "us" unless told otherwise, which is why
# e.g. the \| key was producing \/| instead of the expected ~ (GB is ISO, US is ANSI;
# the physical key's legend/position differs between the two layouts).
input type:keyboard {
    xkb_layout gb
}

# The volume-down key produces sym: NoSymbol (confirmed via `wev`) — the keymap has
# no symbol for it at all, so no `bindsym XF86AudioLowerVolume` can ever match
# regardless of spelling/casing. Bind by keycode instead: 407, exactly as `wev`
# reported it (wev's keycode is already XKB-offset, not raw evdev — verified against
# Super_L: wev showed 133, evdev KEY_LEFTMETA is 125, 125+8=133 — so no further +8
# adjustment needed here). Volume-up isn't affected — its key does produce a real
# XF86AudioRaiseVolume symbol — so the shared config's bindsym for it is left as-is.
bindcode 407 exec pactl set-sink-volume @DEFAULT_SINK@ -5%

# Draft translation from ~/.screenlayout/home.sh (xrandr) — see sway-migration-todo.md
# "Displays" section for the mapping rationale. UNCONFIRMED: names/rate not yet
# checked against `swaymsg -t get_outputs` on this machine.
#
# scale 2: waybar/fonts/cursor were too small at native 4K. NOTE this changes DP-1's
# *logical* size to 1920x1080 (position/workspace-assign math is in logical, not
# physical, pixels) — that's now the same logical height as eDP-1, so no more
# vertical centering offset is needed (was 540 pre-scale; see git history).
# 4K external (USB-C/DP; HDMI faulty)
output DP-1  mode 3840x2160@30Hz position 1920 0
output eDP-1 mode 1920x1080      position 0 0

# Pin workspaces to outputs: 1-4 external, 5-6 built-in. If DP-1 isn't connected,
# sway falls back to putting its workspaces on whatever output is available
# (eDP-1) rather than dropping them — this is just a preference, not a hard rule.
workspace 1 output DP-1
workspace 2 output DP-1
workspace 3 output DP-1
workspace 4 output DP-1
workspace 5 output eDP-1
workspace 6 output eDP-1

# Wallpaper — solid "Dark Aubergine" (#2C001E), the darkest shade in Canonical's
# brand palette. No image file tracked in this repo; sway drives swaybg natively
# via `output bg`, no separate exec needed.
output * bg #2C001E solid_color

# No reform-tools execs, no custom/kanata, no wofi.css here — those are Reform-only.
# reform-wallpaper.py already runs its own swaybg for the Reform; keeping this
# solid-color line Alienware-only avoids two swaybg instances fighting over Reform.

#########################
### AUTOSTART / LAYOUT ###
#########################
# Codifies the workspace layout as it's actually used day-to-day (not an
# idealized scheme — just what's normally open where). Identical to
# alienware-work.conf — the two machines only differ in output resolution.
#   WS1: Chrome + a terminal
#   WS2: Obsidian (both vaults land here — move the second one to WS3
#        yourself; not worth automating which vault goes where)
#   WS3: Firefox + a terminal
#   WS5: Slack
#
# Terminals: plain Alacritty instances, no fixed project dir/zellij session —
# you attach/cd manually after launch. Each gets its own Wayland app_id via
# `--class` so for_window can target the right one specifically. This is
# app_id, not --title: zellij rewrites the window *title* once it starts (pane
# info, session name, etc.), but it cannot touch the app_id — that's fixed at
# window creation by the `--class` flag and immutable afterwards. Matching on
# app_id sidesteps the title-mutation race entirely.
exec alacritty --class ws1-term
exec alacritty --class ws3-term

exec google-chrome-stable
exec firefox
# --disable-gpu: works around the Mesa dri_gbm.so mismatch between host Mesa
# 25.x and the snap's gnome-46-2404 runtime that otherwise makes the Slack
# window invisible on Wayland — same command as the local
# ~/.local/share/applications/slack-disable-gpu.desktop entry, not the stock
# GPU-accelerated one.
exec /snap/bin/slack --disable-gpu

# Both vaults ("open": true for both in ~/.config/obsidian/obsidian.json)
# reopen from a single plain launch. Obsidian is X11 (xwayland) here — hence
# `class`, not `app_id` — and every vault window shares the same class, so
# both windows land on WS2; move the second one to WS3 by hand.
exec obsidian

for_window [app_id="ws1-term"] move to workspace 1
for_window [app_id="google-chrome"] move to workspace 1
for_window [app_id="ws3-term"] move to workspace 3
for_window [app_id="firefox_firefox"] move to workspace 3
for_window [app_id="slack"] move to workspace 5
for_window [class="obsidian"] move to workspace 2
